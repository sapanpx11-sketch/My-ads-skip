workflows:
  android-workflow:
    name: Ad Skipper Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - keystore_credentials   # Codemagic UI me is naam se env group banao (release build ke liye)
      vars:
        PACKAGE_NAME: "com.anarbastanov.adskipper"
    cache:
      cache_paths:
        - ~/.gradle/caches

    scripts:
      - name: Debug - show repo structure
        script: |
          echo "Working directory:"
          pwd
          echo "Top-level files:"
          ls -la
          echo "Looking for gradlew anywhere in repo:"
          find . -iname "gradlew*" -not -path "*/node_modules/*"

      - name: Locate project and build Debug APK
        script: |
          GRADLEW_PATH=$(find . -maxdepth 4 -iname "gradlew" -not -path "*/node_modules/*" | head -1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew kahin bhi nahi mila is repo me. Check karo ki gradlew file git me commit hui hai ya nahi (git add -f gradlew)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project mila yahan: $PROJECT_DIR"
          echo "export PROJECT_DIR=$PROJECT_DIR" >> $CM_ENV
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Add signing config
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            cd "$PROJECT_DIR"
            echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/keystore.jks
            cat >> app/build.gradle.kts <<EOF

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("$CM_BUILD_DIR/keystore.jks")
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("CM_KEY_ALIAS")
                      keyPassword = System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          fi

      - name: Build Release APK
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            cd "$PROJECT_DIR"
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            echo "Keystore env vars set nahi hain, release build skip kiya. Sirf debug APK milega."
          fi

    artifacts:
      - "**/app/build/outputs/apk/**/*.apk"
      - "**/app/build/outputs/**/mapping.txt"

    publishing:
      email:
        recipients:
          - your-email@example.com   # apna email daalo
        notify:
          success: true
          failure: true
