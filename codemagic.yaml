workflows:
  android-workflow:
    name: Ad Skipper Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - keystore_credentials   # Codemagic UI me is naam se env group banao (release build ke liye)
      vars:
        PACKAGE_NAME: "com.anarbastanov.adskipper"
    cache:
      cache_paths:
        - ~/.gradle/caches

    scripts:
      - name: Set Android SDK licenses
        script: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        script: |
          cd ad-skipper-android-1.2.0
          ./gradlew assembleDebug

      - name: Add signing config
        script: |
          cd ad-skipper-android-1.2.0
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/keystore.jks
            cat >> app/build.gradle.kts <<EOF

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("$CM_BUILD_DIR/keystore.jks")
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("CM_KEY_ALIAS")
                      keyPassword = System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          fi

      - name: Build Release APK
        script: |
          cd ad-skipper-android-1.2.0
          if [ -n "$CM_KEYSTORE" ]; then
            ./gradlew assembleRelease
          else
            echo "Keystore env vars set nahi hain, release build skip kiya. Sirf debug APK milega."
          fi

    artifacts:
      - ad-skipper-android-1.2.0/app/build/outputs/apk/**/*.apk
      - ad-skipper-android-1.2.0/app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - your-email@example.com   # apna email daalo
        notify:
          success: true
          failure: true
